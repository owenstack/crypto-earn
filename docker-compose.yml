services:
  engine:
    build:
      context: .
      dockerfile: Dockerfile.engine
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /app/data/cex.db
      IPC_SOCKET: /ipc/cex-engine.sock
      ENABLE_NEWS_REPRICING: "${ENABLE_NEWS_REPRICING:-1}"
      ENABLE_LIQUIDITY_PROVISION: "${ENABLE_LIQUIDITY_PROVISION:-1}"
    volumes:
      - engine-data:/app/data
      - ipc:/ipc
    healthcheck:
      test: ["CMD-SHELL", "test -S /ipc/cex-engine.sock"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  control:
    build:
      context: .
      dockerfile: Dockerfile.control
    restart: unless-stopped
    env_file: .env
    environment:
      IPC_SOCKET: /ipc/cex-engine.sock
      NODE_ENV: production
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    volumes:
      - ipc:/ipc
    depends_on:
      engine:
        condition: service_healthy

volumes:
  engine-data:
  ipc:
    driver_opts:
      type: tmpfs
      device: tmpfs
