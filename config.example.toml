# CEX Arbitrage Bot — Example Configuration
# Copy to config.toml and edit values as needed.
# Schema version must match the bot's expected version.

schema_version = 1
log_level = "INFO"
# dry_run = false

[fetcher]
poll_interval_ms = 1000
request_timeout_ms = 500
backoff_initial_ms = 1000
backoff_max_ms = 30000

[channel]
bbo_capacity = 256
alert_capacity = 64

[trading]
min_profit_pct = 0.1
max_notional_usd = 50000.0

[risk]
max_exposure_per_trade = 25000.0
max_drawdown_pct = 5.0
max_volatility = 0.10
update_interval_s = 5

[notify]
# Secrets: prefer environment variables CEX_TELEGRAM_BOT_TOKEN / CEX_TELEGRAM_CHAT_ID
# bot_token = "123456:ABC-DEF1234ghIkl-zyx57W2v1u123ew11"
# chat_id = "-1001234567890"

[observability]
metrics_port = 9090
health_stale_threshold_s = 10

[pairs]
1 = "BTC/USDC"
# 2 = "ETH/USDT"
